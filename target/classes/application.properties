# Application Name & Server Configuration
spring.application.name=CMD_Appointments
server.port=8081

# Set Jackson (Spring's JSON processor) to use dd-MM-yyyy
spring.jackson.date-format=dd-MM-yyyy
spring.jackson.serialization.write-dates-as-timestamps=false

# Old Server Configuration (commented out for reference)
