spring.application.name=CMD_Clinic_Service
server.port=8085

#MySQL Server connection
spring.datasource.url=jdbc:mysql://cmd-dev.mysql.database.azure.com:3306/cmd?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=cmdadmin
spring.datasource.password=Mypassword@123

# LocalDB Connection settings
#spring.datasource.url=jdbc:mysql://localhost:3306/cmddb5303?createDatabaseIfNotExist=True&useSSL=True
#spring.datasource.username=root
#spring.datasource.password=1234

#data source connection pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
## JPA (JpaBaseConfiguration, HibernateJpaAutoConfiguration)
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=default
spring.jpa.show-sql=true
# DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
#spring.datasource.continue-on-error=false
spring.datasource.generate-unique-name=false
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.serialization.fail-on-empty-beans=false


external.api.url=http://your-external-api-url.com

